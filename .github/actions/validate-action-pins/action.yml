name: Validate action pinning
description: >-
  Fail-closed validator for GitHub Actions `uses:` references. Runs from the
  MAIN-side commit of the calling workflow (invoke it through the immutable
  `$/` same-repository reference), so the checked-out tree under validation
  is treated strictly as data - never as code to execute. Parses every
  YAML-permitted spelling of the `uses` key (quoted keys, spaced colons,
  quoted values, sequence items) and fails closed on any form it cannot
  read. Accepted references: local `./`, immutable same-repo `$/`, and
  third-party actions pinned to a full 40-hex commit.
runs:
  using: composite
  steps:
    - name: Validate every uses reference in the workspace
      shell: bash
      run: node "$GITHUB_ACTION_PATH/validate-action-pins.mjs" "$GITHUB_WORKSPACE"

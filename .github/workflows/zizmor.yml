name: Zizmor

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    types:
      - checks_requested
  schedule:
    - cron: "43 5 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: zizmor-${{ github.ref }}
  queue: max
  cancel-in-progress: false

jobs:
  zizmor:
    name: Run zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # Check out the repository workflows for analysis.
      security-events: write # Upload the complete Zizmor SARIF result.
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Enforce Zizmor findings
        id: enforce
        continue-on-error: true
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          advanced-security: false
          annotations: false
          collect: all
          persona: auditor

      - name: Publish the complete Zizmor SARIF result
        if: ${{ always() }}
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          collect: all
          persona: auditor

      - name: Preserve the fail-closed Zizmor result
        if: ${{ always() && steps.enforce.outcome != 'success' }}
        run: exit 1

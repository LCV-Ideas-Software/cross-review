# This workflow is managed by gh actions-lock.

name: Zizmor

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    types:
      - checks_requested
  schedule:
    - cron: "43 5 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: zizmor-${{ github.ref }}
  queue: max
  cancel-in-progress: false

jobs:
  zizmor:
    name: Run zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # Check out the repository workflows for analysis.
      security-events: write # Upload the complete Zizmor SARIF result.
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Enforce Zizmor findings
        id: enforce
        continue-on-error: true
        uses: zizmorcore/zizmor-action@70fb788f84895a7701f5643d103d587e460b5c99 # v0.6.3
        with:
          advanced-security: false
          annotations: false
          collect: all
          persona: auditor

      - name: Publish the complete Zizmor SARIF result
        if: >-
          ${{
            always() &&
            (
              github.event_name != 'pull_request' ||
              (
                github.event.pull_request.head.repo.full_name == github.repository &&
                github.event.pull_request.user.login != 'dependabot[bot]'
              )
            )
          }}
        uses: zizmorcore/zizmor-action@70fb788f84895a7701f5643d103d587e460b5c99 # v0.6.3
        with:
          collect: all
          persona: auditor

      - name: Preserve the fail-closed Zizmor result
        if: ${{ always() && steps.enforce.outcome != 'success' }}
        run: exit 1

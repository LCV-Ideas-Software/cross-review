name: Zizmor

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "**"
  schedule:
    - cron: "43 5 * * 1"
  workflow_dispatch:

permissions: {}

# The release pipeline (auto-tag.yml, publish.yml) requires a successful push-event
# run of this workflow on main for the exact release SHA, so runs are queued, never
# cancelled.
concurrency:
  group: zizmor-${{ github.workflow }}-${{ github.ref }}
  queue: max
  cancel-in-progress: false

jobs:
  zizmor:
    name: Run zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write # Upload the zizmor SARIF to code scanning.
      contents: read # Check out the repository.
      actions: read # Read workflow metadata for the upload.
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@70fb788f84895a7701f5643d103d587e460b5c99 # v0.6.3

name: Publish

# GitHub's documented model for publishing an npm package: the operator
# publishes a Release, and the run starts with that tag already checked out.
# There is no repository-owned tagging, dispatch or policy machinery.
on:
  release:
    types: [published]

# No workflow-level grant: each job declares its own minimal token scope.
permissions: {}

# Releases are published one at a time so two tags cannot race the registries.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  npmjs:
    name: Publish to npmjs.com
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # `release: published` also fires for a prerelease, and `npm publish`
    # without `--tag` would move `latest` onto it.
    if: ${{ !github.event.release.prerelease }}
    # npm Trusted Publishing authorizes this exact repository, workflow and
    # environment, so the registry holds no long-lived publish token.
    environment: npm-production
    permissions:
      contents: read # Check out the released tag.
      id-token: write # OIDC credential for npm and the provenance statement.
    steps:
      - name: Check out the released tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          check-latest: true
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      # GitHub has no rule binding a Release to the default branch, so the
      # publishing job proves it: the released commit must be part of `main`,
      # where the required checks ran, and the tag must name the manifest
      # version.
      - name: Refuse a release outside main
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          comparison="$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$GITHUB_SHA" --jq '.status')"
          case "$comparison" in
            identical | behind) ;;
            *)
              echo "::error::$GITHUB_SHA is not part of main (compare status: $comparison); refusing to publish."
              exit 1
              ;;
          esac
          manifest_tag="v$(node -p "require('./package.json').version.split('.').map((part) => part.padStart(2, '0')).join('.')")"
          if [ "$RELEASE_TAG" != "$manifest_tag" ]; then
            echo "::error::Release tag $RELEASE_TAG does not name the manifest version $manifest_tag."
            exit 1
          fi
          echo "Release $RELEASE_TAG is on main at $GITHUB_SHA and matches the manifest."

      # No dependency lifecycle script runs on the publishing path; the
      # package's own `prepack` still cleans and builds the tarball.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      # `prepack` cleans and builds, so the tarball is produced by npm's own
      # lifecycle from the released tag.
      - name: Publish to npmjs.com
        run: npm publish --provenance --access public

  github-packages:
    name: Publish to GitHub Packages
    needs: npmjs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # `release: published` also fires for a prerelease, and `npm publish`
    # without `--tag` would move `latest` onto it.
    if: ${{ !github.event.release.prerelease }}
    permissions:
      contents: read # Check out the released tag.
      packages: write # Publish the package to GitHub Packages.
      id-token: write # Provenance statement for the mirrored package.
    steps:
      - name: Check out the released tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          check-latest: true
          package-manager-cache: false
          registry-url: https://npm.pkg.github.com

      # No dependency lifecycle script runs on the publishing path; the
      # package's own `prepack` still cleans and builds the tarball.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Publish to GitHub Packages
        run: npm publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

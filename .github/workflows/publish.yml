name: Publish

# GitHub's documented model for publishing an npm package: a Release is
# published and the run starts with that tag already checked out. The
# repository owns no tagging, dispatch or policy machinery.
on:
  release:
    types: [published]

# No workflow-level grant: each job declares its own minimal token scope.
permissions: {}

# Releases are published one at a time so two tags cannot race the registries.
# `queue: max` keeps every pending publication: with the default `single`, a
# third Release would cancel the pending second one, and its only
# `release: published` event is already spent.
concurrency:
  group: publish
  queue: max
  cancel-in-progress: false

jobs:
  # Everything that inspects the repository, the release and the registry
  # happens here, where no publishing identity exists. Dependency-provided
  # build tools therefore never run in a job that could exchange the OIDC
  # credential for a registry token, and a refusal stops the publication
  # before an artifact exists.
  build:
    name: Build the release tarball
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read # Read the released tag, main's manifest and nothing else.
    outputs:
      tarball: ${{ steps.pack.outputs.tarball }}
    steps:
      - name: Check out the released tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          check-latest: true
          package-manager-cache: false

      # Four properties that neither GitHub nor npm enforces on its own: the
      # released commit belongs to `main`, where the required checks ran; the
      # tag names the manifest version; that version is the one `main` declares
      # now; and it is newer than the one the registry serves, because
      # `npm publish` moves `latest` to whatever it publishes, in any order.
      - name: Refuse a release outside main, mislabelled, superseded or behind the registry
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          set -euo pipefail
          # A Release its author marked as a prerelease is refused here, as a
          # failed run, not through a job-level `if:`: a skipped workflow reads
          # as a completed no-op, and the one-time `release: published` event
          # is already spent by then.
          if [ "$RELEASE_PRERELEASE" = "true" ]; then
            echo "::error::Release $RELEASE_TAG is marked as a prerelease; this repository publishes only stable versions."
            exit 1
          fi

          comparison="$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$GITHUB_SHA" --jq '.status')"
          case "$comparison" in
            identical | behind) ;;
            *)
              echo "::error::$GITHUB_SHA is not part of main (compare status: $comparison); refusing to publish."
              exit 1
              ;;
          esac

          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"

          # The manifest is checked as well: the Release flag above is set by
          # whoever creates the Release and says nothing about the version
          # being published.
          case "$package_version" in
            *-*)
              echo "::error::$package_version is a prerelease; this repository publishes only stable versions."
              exit 1
              ;;
          esac

          # SemVer also allows build metadata (`4.6.7+linux`), which carries no
          # hyphen and would survive the guard above. The `vXX.XX.XX` tag below
          # is derived by padding numeric components, so anything but a plain
          # three-part version must stop here instead of producing a tag no
          # Release can carry.
          if ! printf '%s\n' "$package_version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::$package_version is not a plain three-part numeric version; this repository publishes only vXX.XX.XX releases."
            exit 1
          fi

          manifest_tag="v$(node -p "require('./package.json').version.split('.').map((part) => part.padStart(2, '0')).join('.')")"
          if [ "$RELEASE_TAG" != "$manifest_tag" ]; then
            echo "::error::Release tag $RELEASE_TAG does not name the manifest version $manifest_tag."
            exit 1
          fi

          # The released version must be the one `main` declares now. Without
          # this, an older tag that was never released still satisfies every
          # check above and the registry comparison below: `v04.06.05` sits on
          # `main` and is newer than the published 4.6.4, so it would publish a
          # version `main` has already superseded.
          main_version="$(gh api "repos/$GITHUB_REPOSITORY/contents/package.json?ref=main" -H "Accept: application/vnd.github.raw" --jq '.version')"
          if [ "$package_version" != "$main_version" ]; then
            echo "::error::$package_version is not the version main declares ($main_version); refusing to publish a superseded release."
            exit 1
          fi

          # Fail closed: only npm's explicit not-found means the package has
          # never been published. Every other failure refuses to publish
          # instead of silently allowing a downgrade.
          registry_error="$RUNNER_TEMP/npm-view.err"
          if published_latest="$(npm view "$package_name" version 2>"$registry_error")"; then
            :
          elif grep -q 'E404' "$registry_error"; then
            published_latest=""
          else
            cat "$registry_error" >&2
            echo "::error::Could not read the published version of $package_name; refusing to publish."
            exit 1
          fi
          if [ -n "$published_latest" ] && [ "$published_latest" != "$package_version" ]; then
            newest="$(printf '%s\n%s\n' "$published_latest" "$package_version" | sort -V | tail -n 1)"
            if [ "$newest" != "$package_version" ]; then
              echo "::error::$package_version is older than the published latest ($published_latest); refusing to move the latest dist-tag backward."
              exit 1
            fi
          fi
          echo "Release $RELEASE_TAG is on main at $GITHUB_SHA, names the version main declares ($main_version) and is newer than ${published_latest:-no published version}."

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # `npm pack` runs `prepack`, whose build writes to stdout, so the
      # filename is discovered on disk instead of captured from the command.
      - name: Pack the release tarball
        id: pack
        run: |
          set -euo pipefail
          pack_dir="$RUNNER_TEMP/release"
          mkdir -p "$pack_dir"
          npm pack --pack-destination "$pack_dir"
          packed_count="$(find "$pack_dir" -maxdepth 1 -name '*.tgz' | wc -l)"
          if [ "$packed_count" -ne 1 ]; then
            echo "::error::Expected exactly one packed tarball, found $packed_count."
            exit 1
          fi
          tarball="$(basename "$(find "$pack_dir" -maxdepth 1 -name '*.tgz')")"
          echo "tarball=$tarball" >>"$GITHUB_OUTPUT"
          echo "Packed $tarball"

      - name: Upload the release tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-tarball
          path: ${{ runner.temp }}/release/*.tgz
          retention-days: 5
          if-no-files-found: error

  # The writers do one thing: publish the artifact the build job produced.
  # They never check out the repository and never install a dependency, so no
  # repository code and no npm dependency runs beside the publishing identity.
  # Two GitHub-authored actions do run there, pinned by full-length SHA:
  # configuring the registry and fetching the artifact cannot be done without
  # them, and replacing them with hand-written shell would put more code, not
  # less, next to the credential. The contract suite allows only those two.
  npmjs:
    name: Publish to npmjs.com
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # npm Trusted Publishing authorizes this exact repository, workflow and
    # environment, so the registry holds no long-lived publish token.
    environment: npm-production
    permissions:
      id-token: write # OIDC credential for npm and the provenance statement.
    steps:
      - name: Setup Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          check-latest: true
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Download the release tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-tarball
          path: ${{ runner.temp }}/release

      - name: Publish to npmjs.com
        env:
          TARBALL: ${{ needs.build.outputs.tarball }}
        run: npm publish "$RUNNER_TEMP/release/$TARBALL" --provenance --access public --ignore-scripts

  github-packages:
    name: Publish to GitHub Packages
    needs: [build, npmjs]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      packages: write # Publish the package to GitHub Packages.
      id-token: write # Provenance statement for the mirrored package.
    steps:
      - name: Setup Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          check-latest: true
          package-manager-cache: false
          registry-url: https://npm.pkg.github.com

      - name: Download the release tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-tarball
          path: ${{ runner.temp }}/release

      - name: Publish to GitHub Packages
        env:
          TARBALL: ${{ needs.build.outputs.tarball }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm publish "$RUNNER_TEMP/release/$TARBALL" --provenance --access public --ignore-scripts

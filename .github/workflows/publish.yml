name: Publish

# GitHub's documented model, without a manual gesture: a push to `main` that
# changes the manifest version publishes the package and then records the
# Release. The repository owns no tagging, dispatch or policy machinery and
# holds no publishing secret: npm authorizes the run through Trusted
# Publishing (OIDC), and the Release is created with the run's own token.
on:
  push:
    branches: [main]
    paths: [package.json]

# No workflow-level grant: each job declares its own minimal token scope.
permissions: {}

# Publications run one at a time so two bumps cannot race the registries.
# `queue: max` keeps every pending run: with the default `single`, a third
# push would cancel the pending second one and its version would never be
# published.
concurrency:
  group: publish
  queue: max
  cancel-in-progress: false

jobs:
  # Everything that inspects the manifest, the tags and the registry happens
  # here, where no publishing identity exists. Dependency-provided build tools
  # therefore never run in a job that could exchange the OIDC credential for a
  # registry token, and a refusal stops the publication before an artifact
  # exists.
  #
  # The push that bumps the version is the push that publishes: the manifest
  # version is compared with the one the previous head declared, so a push
  # that touched `package.json` without changing the version, which is what a
  # Dependabot merge is, ends here as a no-op and says so. A run that dies
  # after a registry write is resumed with `gh run rerun --failed`, GitHub's
  # own recovery: it reruns only the failed jobs and keeps the outputs of the
  # ones that passed, so nothing is published twice.
  build:
    name: Decide and build the release tarball
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read # Read both manifests and the existing tags, nothing else.
    outputs:
      publish: ${{ steps.decide.outputs.publish }}
      tag: ${{ steps.decide.outputs.tag }}
      tarball: ${{ steps.pack.outputs.tarball }}
    steps:
      - name: Check out the pushed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          check-latest: true
          package-manager-cache: false

      # Every read fails closed: only an explicit not-found means "absent";
      # any other failure refuses to decide. A prerelease, a version the
      # `vXX.XX.XX` form cannot express, or a version npm already serves is a
      # refusal, and the run fails saying which.
      - name: Decide whether this push publishes
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          errors="$RUNNER_TEMP/decide.err"

          # Did this push change the version? `main` is protected against
          # force-push, so the previous head always exists.
          if ! before_version="$(gh api "repos/$GITHUB_REPOSITORY/contents/package.json?ref=$BEFORE_SHA" -H "Accept: application/vnd.github.raw" --jq '.version' 2>"$errors")"; then
            cat "$errors" >&2
            echo "::error::Could not read the manifest at the previous head $BEFORE_SHA; refusing to decide."
            exit 1
          fi
          if [ "$before_version" = "$package_version" ]; then
            echo "The manifest version is still $package_version: this push changed package.json without bumping the version, so it publishes nothing."
            echo "publish=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          case "$package_version" in
            *-*)
              echo "::error::$package_version is a prerelease; this repository publishes only stable versions."
              exit 1
              ;;
          esac
          # SemVer also allows build metadata (`4.6.7+linux`), which carries no
          # hyphen. The tag below pads numeric components, so anything but a
          # plain three-part version stops here instead of producing a tag no
          # Release can carry.
          if ! printf '%s\n' "$package_version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::$package_version is not a plain three-part numeric version; this repository publishes only vXX.XX.XX releases."
            exit 1
          fi
          tag="v$(printf '%s' "$package_version" | awk -F. '{ printf "%02d.%02d.%02d", $1, $2, $3 }')"

          # An existing tag means a previous run finished: the Release is
          # created last, so nothing is left to do.
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>"$errors"; then
            echo "Tag $tag already exists: $package_version was published and recorded before, so this run does nothing."
            echo "publish=false" >>"$GITHUB_OUTPUT"
            exit 0
          elif ! grep -q 'HTTP 404' "$errors"; then
            cat "$errors" >&2
            echo "::error::Could not read tag $tag; refusing to decide."
            exit 1
          fi

          # `npm publish` moves `latest` to whatever it publishes, in any order.
          # Only npm's explicit not-found means the package was never
          # published; every other failure refuses instead of allowing a
          # downgrade. A version npm already serves with no tag is a run that
          # died after the npm write: that is resumed, not repeated.
          if published_latest="$(npm view "$package_name" version 2>"$errors")"; then
            :
          elif grep -q 'E404' "$errors"; then
            published_latest=""
          else
            cat "$errors" >&2
            echo "::error::Could not read the published version of $package_name; refusing to publish."
            exit 1
          fi
          if [ "$published_latest" = "$package_version" ]; then
            echo "::error::The registry already serves $package_version but tag $tag does not exist: a previous run died after that write. Resume it with 'gh run rerun --failed <run-id>'; do not start over."
            exit 1
          fi
          if [ -n "$published_latest" ]; then
            newest="$(printf '%s\n%s\n' "$published_latest" "$package_version" | sort -V | tail -n 1)"
            if [ "$newest" != "$package_version" ]; then
              echo "::error::$package_version is older than the published latest ($published_latest); refusing to move the latest dist-tag backward."
              exit 1
            fi
          fi

          echo "publish=true" >>"$GITHUB_OUTPUT"
          echo "tag=$tag" >>"$GITHUB_OUTPUT"
          echo "This push publishes $package_version as $tag, newer than ${published_latest:-no published version}."

      - name: Install dependencies
        if: steps.decide.outputs.publish == 'true'
        run: npm ci --ignore-scripts

      # `npm pack` runs `prepack`, whose build writes to stdout, so the
      # filename is discovered on disk instead of captured from the command.
      - name: Pack the release tarball
        if: steps.decide.outputs.publish == 'true'
        id: pack
        run: |
          set -euo pipefail
          pack_dir="$RUNNER_TEMP/release"
          mkdir -p "$pack_dir"
          npm pack --pack-destination "$pack_dir"
          packed_count="$(find "$pack_dir" -maxdepth 1 -name '*.tgz' | wc -l)"
          if [ "$packed_count" -ne 1 ]; then
            echo "::error::Expected exactly one packed tarball, found $packed_count."
            exit 1
          fi
          tarball="$(basename "$(find "$pack_dir" -maxdepth 1 -name '*.tgz')")"
          echo "tarball=$tarball" >>"$GITHUB_OUTPUT"
          echo "Packed $tarball"

      - name: Upload the release tarball
        if: steps.decide.outputs.publish == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-tarball
          path: ${{ runner.temp }}/release/*.tgz
          retention-days: 5
          if-no-files-found: error

  # The writers do one thing: publish the artifact the build job produced.
  # They never check out the repository and never install a dependency, so no
  # repository code and no npm dependency runs beside the publishing identity.
  # Two GitHub-authored actions do run there, pinned by full-length SHA:
  # configuring the registry and fetching the artifact cannot be done without
  # them, and replacing them with hand-written shell would put more code, not
  # less, next to the credential.
  npmjs:
    name: Publish to npmjs.com
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # npm Trusted Publishing authorizes this exact repository, workflow file
    # and environment, whatever the event, so the registry holds no long-lived
    # publish token.
    environment: npm-production
    permissions:
      id-token: write # OIDC credential for npm and the provenance statement.
    steps:
      - name: Setup Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          check-latest: true
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Download the release tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-tarball
          path: ${{ runner.temp }}/release

      - name: Publish to npmjs.com
        env:
          TARBALL: ${{ needs.build.outputs.tarball }}
        run: npm publish "$RUNNER_TEMP/release/$TARBALL" --provenance --access public --ignore-scripts

  github-packages:
    name: Publish to GitHub Packages
    needs: [build, npmjs]
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      packages: write # Publish the package to GitHub Packages.
      id-token: write # Provenance statement for the mirrored package.
    steps:
      - name: Setup Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          check-latest: true
          package-manager-cache: false
          registry-url: https://npm.pkg.github.com

      - name: Download the release tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-tarball
          path: ${{ runner.temp }}/release

      - name: Publish to GitHub Packages
        env:
          TARBALL: ${{ needs.build.outputs.tarball }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm publish "$RUNNER_TEMP/release/$TARBALL" --provenance --access public --ignore-scripts

  # The Release is the record of a publication that already happened, created
  # last so a registry failure never leaves an immutable Release behind. The
  # run's own token creates the tag and the Release; no personal token, no
  # App. This job checks nothing out and installs nothing.
  release:
    name: Record the Release
    needs: [build, npmjs, github-packages]
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # Create the tag and the Release for the version just published.
    steps:
      - name: Create the Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
        run: gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --generate-notes

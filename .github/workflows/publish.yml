name: Publish

# GitHub's documented model for publishing an npm package: the operator
# publishes a Release, and the run starts with that tag already checked out.
# There is no repository-owned tagging, dispatch or policy machinery.
on:
  release:
    types: [published]

# No workflow-level grant: each job declares its own minimal token scope.
permissions: {}

# Releases are published one at a time so two tags cannot race the registries.
# `queue: max` keeps every pending publication: with the default `single`, a
# third Release would cancel the pending second one, and its only
# `release: published` event is already spent.
concurrency:
  group: publish
  queue: max
  cancel-in-progress: false

jobs:
  # The tarball is built where no publishing identity exists. GitHub scopes the
  # token per job, so dependency-provided build tools (tsc, esbuild) never run
  # in a job that could exchange the OIDC credential for a registry token.
  build:
    name: Build the release tarball
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # `release: published` also fires for a prerelease, and `npm publish`
    # without `--tag` would move `latest` onto it.
    if: ${{ !github.event.release.prerelease }}
    permissions:
      contents: read # Check out the released tag.
    outputs:
      tarball: ${{ steps.pack.outputs.tarball }}
    steps:
      - name: Check out the released tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          check-latest: true
          package-manager-cache: false

      # No dependency lifecycle script runs; the package's own `prepack` still
      # cleans and builds the tarball.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Pack the release tarball
        id: pack
        run: |
          set -euo pipefail
          tarball="$(npm pack --pack-destination "$RUNNER_TEMP")"
          echo "tarball=$tarball" >>"$GITHUB_OUTPUT"
          echo "Packed $tarball"

      - name: Upload the release tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-tarball
          path: ${{ runner.temp }}/${{ steps.pack.outputs.tarball }}
          retention-days: 5
          if-no-files-found: error

  npmjs:
    name: Publish to npmjs.com
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # npm Trusted Publishing authorizes this exact repository, workflow and
    # environment, so the registry holds no long-lived publish token.
    environment: npm-production
    permissions:
      contents: read # Read package.json for the release guard.
      id-token: write # OIDC credential for npm and the provenance statement.
    steps:
      - name: Check out the released tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          check-latest: true
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      # GitHub has no rule binding a Release to the default branch, and
      # `npm publish` moves the `latest` dist-tag to whatever it publishes.
      # This step proves the three things neither GitHub nor npm proves: the
      # released commit is part of `main`, where the required checks ran; the
      # tag names the manifest version; and the version is newer than what the
      # registry already serves.
      - name: Refuse a release outside main or behind the published latest
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          comparison="$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$GITHUB_SHA" --jq '.status')"
          case "$comparison" in
            identical | behind) ;;
            *)
              echo "::error::$GITHUB_SHA is not part of main (compare status: $comparison); refusing to publish."
              exit 1
              ;;
          esac
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          # The organization display tag is vXX.XX.XX and both publish commands
          # omit `--tag`, so a prerelease manifest would take `latest`. The
          # GitHub prerelease flag is set by whoever creates the Release, which
          # is not evidence about the manifest.
          case "$package_version" in
            *-*)
              echo "::error::$package_version is a prerelease; this repository publishes only stable versions."
              exit 1
              ;;
          esac
          manifest_tag="v$(node -p "require('./package.json').version.split('.').map((part) => part.padStart(2, '0')).join('.')")"
          if [ "$RELEASE_TAG" != "$manifest_tag" ]; then
            echo "::error::Release tag $RELEASE_TAG does not name the manifest version $manifest_tag."
            exit 1
          fi
          # Fail closed: only npm's explicit "not found" means the package has
          # never been published. Every other failure keeps the guard honest
          # instead of silently allowing a downgrade.
          registry_error="$RUNNER_TEMP/npm-view.err"
          if published_latest="$(npm view "$package_name" version 2>"$registry_error")"; then
            :
          elif grep -q 'E404' "$registry_error"; then
            published_latest=""
          else
            cat "$registry_error" >&2
            echo "::error::Could not read the published version of $package_name; refusing to publish."
            exit 1
          fi
          if [ -n "$published_latest" ] && [ "$published_latest" != "$package_version" ]; then
            newest="$(printf '%s\n%s\n' "$published_latest" "$package_version" | sort -V | tail -n 1)"
            if [ "$newest" != "$package_version" ]; then
              echo "::error::$package_version is older than the published latest ($published_latest); refusing to move the latest dist-tag backward."
              exit 1
            fi
          fi
          echo "Release $RELEASE_TAG is on main at $GITHUB_SHA, matches the manifest and is newer than ${published_latest:-no published version}."

      - name: Download the release tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-tarball
          path: ${{ runner.temp }}/release

      # Publishing the packed tarball with scripts disabled keeps every
      # dependency-provided binary out of this job's OIDC identity.
      - name: Publish to npmjs.com
        env:
          TARBALL: ${{ needs.build.outputs.tarball }}
        run: |
          set -euo pipefail
          npm publish "$RUNNER_TEMP/release/$TARBALL" --provenance --access public --ignore-scripts

  github-packages:
    name: Publish to GitHub Packages
    needs: [build, npmjs]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read # Read the repository configuration for npm.
      packages: write # Publish the package to GitHub Packages.
      id-token: write # Provenance statement for the mirrored package.
    steps:
      - name: Check out the released tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          check-latest: true
          package-manager-cache: false
          registry-url: https://npm.pkg.github.com

      - name: Download the release tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-tarball
          path: ${{ runner.temp }}/release

      - name: Publish to GitHub Packages
        env:
          TARBALL: ${{ needs.build.outputs.tarball }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          npm publish "$RUNNER_TEMP/release/$TARBALL" --provenance --access public --ignore-scripts

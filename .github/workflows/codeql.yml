# This workflow is managed by gh actions-lock.

name: CodeQL
on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  merge_group:
    types:
      - checks_requested
  schedule:
    - cron: "35 6 * * 2"
# Read-only top level (Scorecard Token-Permissions): the analyze job
# declares the SARIF upload write scope itself.
permissions:
  contents: read
concurrency:
  group: codeql-${{ github.ref }}
  queue: max
  cancel-in-progress: false
jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    # contents:read fetches the repository; security-events:write
    # uploads the CodeQL SARIF analyses.
    permissions:
      contents: read # checkout of the analyzed repository
      security-events: write # uploads the CodeQL SARIF analyses
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-and-quality
          dependency-caching: true
      - name: Perform CodeQL analysis
        id: analyze
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: "/language:${{ matrix.language }}"
          output: ${{ runner.temp }}/codeql-results

      - name: Enforce zero CodeQL findings
        uses: LCV-Ideas-Software/.github/codeql-sarif-gate@24b0bcc09a48b47f740b8a8bd972374f7289e48e # codeql-sarif-gate/v1.0.0
        with:
          sarif-directory: ${{ runner.temp }}/codeql-results

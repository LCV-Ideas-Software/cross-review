# This workflow is managed by gh actions-lock.

name: OpenSSF Scorecard
on:
  push:
    branches: ["main"]
  schedule:
    - cron: "37 8 * * 1"
  workflow_dispatch:
concurrency:
  group: scorecard-${{ github.ref }}
  queue: max
  cancel-in-progress: false
# contents:read fetches the repository; security-events:write uploads the
# Scorecard SARIF analyses. No other scope is exercised.
permissions:
  contents: read
  security-events: write

jobs:
  scorecard:
    name: OpenSSF Scorecard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          # OpenSSF's publication API rejects workflows with organization-mandated write-all.
          # SARIF and artifacts remain enabled below.
          publish_results: false
      - name: Upload SARIF artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-results
          path: scorecard-results.sarif
          retention-days: 5
      - name: Upload SARIF to code-scanning
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          sarif_file: scorecard-results.sarif

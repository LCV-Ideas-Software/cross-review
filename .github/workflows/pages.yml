# This workflow is managed by gh actions-lock.

name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
# Read-only top level (Scorecard Token-Permissions): the deploy job
# declares the Pages deployment write scopes itself.
permissions:
  contents: read
concurrency:
  group: pages
  queue: max
  cancel-in-progress: false
jobs:
  deploy:
    name: Deploy GitHub Pages
    # contents:read fetches the site sources; pages:write +
    # id-token:write are the documented pair for the official
    # Pages deployment action.
    permissions:
      contents: read # checkout of the site sources
      id-token: write # OIDC token consumed by deploy-pages
      pages: write # publishes the Pages deployment
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
    timeout-minutes: 30

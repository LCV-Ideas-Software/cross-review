# Every zizmor audit is enabled. Since v04.06.01 the abolished write-all
# policy is gone: workflows hold read-only top-level grants and each job
# declares its minimal scopes, so excessive-permissions guards regressions.
rules:
  dependabot-cooldown:
    # The organization standard applies a seven-day cooldown to version updates
    # (GitHub Actions: `actions/*` and `github/*` excluded) while security
    # updates bypass cooldown.
    config:
      days: 7
  dangerous-triggers:
    ignore:
      # Main-only workflow_run consumer validates a same-repository push, the
      # exact successful CI SHA in live main history, and all immutable-SHA
      # security gates before tagging.
      - auto-tag.yml
